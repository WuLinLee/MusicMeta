name: MusicMeta Android - Build and Preview Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_type:
        description: "发布渠道；默认预览版，正式版需要明确选择"
        required: true
        type: choice
        default: preview
        options:
          - preview
          - formal

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Verify preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "/usr/local/lib/android/sdk/platform-tools" >> "$GITHUB_PATH"
          test -d /usr/local/lib/android/sdk/platforms/android-35
          test -d /usr/local/lib/android/sdk/build-tools/35.0.0
          ls /usr/local/lib/android/sdk/platforms
          ls /usr/local/lib/android/sdk/build-tools
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Verify uploaded cover 3 transparency and preserve original pixels
        run: |
          python3 -m pip install --quiet Pillow
          python3 - <<'PY'
          from PIL import Image
          image = Image.open("app/src/main/res/drawable/musicmeta_cover.png")
          print(f"Using cover 3 unchanged: {image.width}x{image.height}, {image.format}, mode={image.mode}")
          if image.mode not in ("RGBA", "LA") and "transparency" not in image.info:
              raise SystemExit("Cover 3 must retain its transparent background.")
          if "A" in image.getbands() and image.getchannel("A").getextrema()[0] == 255:
              raise SystemExit("Cover 3 alpha channel is fully opaque; expected transparent cutout.")
          PY
      - name: Require persistent signing secrets
        env:
          MUSICMETA_KEYSTORE_BASE64: ${{ secrets.MUSICMETA_KEYSTORE_BASE64 }}
          MUSICMETA_STORE_PASSWORD: ${{ secrets.MUSICMETA_STORE_PASSWORD }}
          MUSICMETA_KEY_ALIAS: ${{ secrets.MUSICMETA_KEY_ALIAS }}
          MUSICMETA_KEY_PASSWORD: ${{ secrets.MUSICMETA_KEY_PASSWORD }}
        run: |
          if [[ -z "$MUSICMETA_KEYSTORE_BASE64" || -z "$MUSICMETA_STORE_PASSWORD" || -z "$MUSICMETA_KEY_ALIAS" || -z "$MUSICMETA_KEY_PASSWORD" ]]; then
            echo "::error::Fixed signing key is not configured. Add all four MUSICMETA_* repository Actions secrets before building a release."
            exit 1
          fi
      - name: Read app version
        run: |
          VERSION_NAME="$(grep 'versionName = "' app/build.gradle.kts | sed -E 's/.*versionName = "([^"]+)".*/\1/' | head -n 1)"
          if [[ -z "$VERSION_NAME" ]]; then
            echo "Could not determine Android versionName." >&2
            exit 1
          fi
          echo "MUSICMETA_VERSION=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "MUSICMETA_APK=MusicMeta-v$VERSION_NAME.apk" >> "$GITHUB_ENV"
      - name: Run tests and build release APK
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleRelease
      - name: Align and sign APK with the persistent key
        env:
          MUSICMETA_KEYSTORE_BASE64: ${{ secrets.MUSICMETA_KEYSTORE_BASE64 }}
          MUSICMETA_STORE_PASSWORD: ${{ secrets.MUSICMETA_STORE_PASSWORD }}
          MUSICMETA_KEY_ALIAS: ${{ secrets.MUSICMETA_KEY_ALIAS }}
          MUSICMETA_KEY_PASSWORD: ${{ secrets.MUSICMETA_KEY_PASSWORD }}
        run: |
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          RELEASE_UNSIGNED="app/build/outputs/apk/release/app-release-unsigned.apk"
          test -s "$RELEASE_UNSIGNED"
          "$BUILD_TOOLS/zipalign" -f -p 4 "$RELEASE_UNSIGNED" "$RUNNER_TEMP/musicmeta-release-aligned.apk"
          KEYSTORE_PATH="$RUNNER_TEMP/musicmeta-signing.keystore"
          printf '%s' "$MUSICMETA_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          keytool -list -keystore "$KEYSTORE_PATH" -storepass "$MUSICMETA_STORE_PASSWORD" -alias "$MUSICMETA_KEY_ALIAS" >/dev/null
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$KEYSTORE_PATH" \
            --ks-pass "pass:$MUSICMETA_STORE_PASSWORD" \
            --key-pass "pass:$MUSICMETA_KEY_PASSWORD" \
            --ks-key-alias "$MUSICMETA_KEY_ALIAS" \
            --out "$MUSICMETA_APK" \
            "$RUNNER_TEMP/musicmeta-release-aligned.apk"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$MUSICMETA_APK"
          "$BUILD_TOOLS/aapt" dump badging "$MUSICMETA_APK" | head -n 5
      - name: Check APK package metadata
        run: |
          test -s "$MUSICMETA_APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$MUSICMETA_APK" | grep -q "package: name='com.wulinlee.musicmeta'"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$MUSICMETA_APK"
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MusicMeta-v${{ env.MUSICMETA_VERSION }}
          path: ${{ env.MUSICMETA_APK }}
          if-no-files-found: error
          retention-days: 30
      - name: Publish preview or explicitly requested formal release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_RELEASE_TYPE: ${{ github.event_name == 'workflow_dispatch' && inputs.release_type || (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'release:') && 'formal') || 'preview' }}
        run: |
          RELEASE_TYPE="$REQUESTED_RELEASE_TYPE"
          if [[ "$RELEASE_TYPE" == "formal" ]]; then
            VERSION="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)"
            if [[ -z "$VERSION" ]]; then
              echo "Could not determine Android versionName." >&2
              exit 1
            fi
            TAG="v$VERSION"
            if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
            fi
            sed 's/预览版/正式版/g' RELEASE_NOTES.md > "$RUNNER_TEMP/formal-release-notes.md"
            gh release create "$TAG" "$MUSICMETA_APK" \
              --repo "$GITHUB_REPOSITORY" \
              --title "音笺 MusicMeta v$VERSION" \
              --notes-file "$RUNNER_TEMP/formal-release-notes.md" \
              --target "$GITHUB_SHA"

            PREVIEW_TAG="preview-$(git rev-parse --short "$GITHUB_SHA")"
            gh release create "$PREVIEW_TAG" "$MUSICMETA_APK" \
              --repo "$GITHUB_REPOSITORY" \
              --title "音笺 MusicMeta 预览备份 $PREVIEW_TAG" \
              --notes-file RELEASE_NOTES.md \
              --prerelease \
              --target "$GITHUB_SHA"

            # Replace the previous formal release only after both new assets exist.
            if gh release view "v0.1.3" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              gh release delete "v0.1.3" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
            fi
          else
            TAG="preview-$(git rev-parse --short "$GITHUB_SHA")"
            gh release create "$TAG" "$MUSICMETA_APK" \
              --repo "$GITHUB_REPOSITORY" \
              --title "音笺 MusicMeta 预览版 $TAG" \
              --notes-file RELEASE_NOTES.md \
              --prerelease \
              --target "$GITHUB_SHA"
          fi
