name: MusicMeta Android - Build and Preview Release

concurrency:
  group: musicmeta-android-release
  cancel-in-progress: true

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_type:
        description: "发布渠道；默认预览版，正式版需要明确选择"
        required: true
        type: choice
        default: preview
        options:
          - preview
          - formal

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Verify preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "/usr/local/lib/android/sdk/platform-tools" >> "$GITHUB_PATH"
          test -d /usr/local/lib/android/sdk/platforms/android-35
          test -d /usr/local/lib/android/sdk/build-tools/35.0.0
          ls /usr/local/lib/android/sdk/platforms
          ls /usr/local/lib/android/sdk/build-tools
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Verify uploaded cover 3 transparency and preserve original pixels
        run: |
          python3 -m pip install --quiet Pillow
          python3 - <<'PY'
          from PIL import Image
          image = Image.open("app/src/main/res/drawable/musicmeta_cover.png")
          print(f"Using cover 3 unchanged: {image.width}x{image.height}, {image.format}, mode={image.mode}")
          if image.mode not in ("RGBA", "LA") and "transparency" not in image.info:
              raise SystemExit("Cover 3 must retain its transparent background.")
          if "A" in image.getbands() and image.getchannel("A").getextrema()[0] == 255:
              raise SystemExit("Cover 3 alpha channel is fully opaque; expected transparent cutout.")
          PY
      - name: Read app version
        run: |
          VERSION_NAME="$(grep 'versionName = "' app/build.gradle.kts | sed -E 's/.*versionName = "([^"]+)".*/\1/' | head -n 1)"
          if [[ -z "$VERSION_NAME" ]]; then
            echo "Could not determine Android versionName." >&2
            exit 1
          fi
          echo "MUSICMETA_VERSION=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "MUSICMETA_APK=MusicMeta-v$VERSION_NAME.apk" >> "$GITHUB_ENV"
      - name: Run tests and build release APK
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleRelease
      - name: Align and sign APK
        env:
          MUSICMETA_KEYSTORE_BASE64: ${{ secrets.MUSICMETA_KEYSTORE_BASE64 }}
          MUSICMETA_KEYSTORE_PASSWORD: ${{ secrets.MUSICMETA_KEYSTORE_PASSWORD }}
          MUSICMETA_KEY_ALIAS: ${{ secrets.MUSICMETA_KEY_ALIAS }}
          MUSICMETA_KEY_PASSWORD: ${{ secrets.MUSICMETA_KEY_PASSWORD }}
        run: |
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          RELEASE_UNSIGNED="app/build/outputs/apk/release/app-release-unsigned.apk"
          test -s "$RELEASE_UNSIGNED"
          "$BUILD_TOOLS/zipalign" -f -p 4 "$RELEASE_UNSIGNED" "$RUNNER_TEMP/musicmeta-release-aligned.apk"

          KEYSTORE_PATH="$RUNNER_TEMP/musicmeta-release.keystore"
          if [[ -n "${MUSICMETA_KEYSTORE_BASE64:-}${MUSICMETA_KEYSTORE_PASSWORD:-}${MUSICMETA_KEY_ALIAS:-}${MUSICMETA_KEY_PASSWORD:-}" ]]; then
            if [[ -z "${MUSICMETA_KEYSTORE_BASE64:-}" || -z "${MUSICMETA_KEYSTORE_PASSWORD:-}" || -z "${MUSICMETA_KEY_ALIAS:-}" || -z "${MUSICMETA_KEY_PASSWORD:-}" ]]; then
              echo "Signing secrets are only partially configured. Set all four MUSICMETA_KEYSTORE_* secrets or remove them all." >&2
              exit 1
            fi
            printf '%s' "$MUSICMETA_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
            STORE_PASSWORD="$MUSICMETA_KEYSTORE_PASSWORD"
            KEY_PASSWORD="$MUSICMETA_KEY_PASSWORD"
            KEY_ALIAS="$MUSICMETA_KEY_ALIAS"
            echo "Using the repository's persistent release signing key."
          else
            echo "::warning::Persistent signing secrets are missing; this APK uses a temporary key and cannot be used for seamless in-place upgrades."
            STORE_PASSWORD="$(openssl rand -hex 24)"
            KEY_PASSWORD="$STORE_PASSWORD"
            KEY_ALIAS="musicmeta-release"
            keytool -genkeypair -noprompt \
              -keystore "$KEYSTORE_PATH" \
              -storepass "$STORE_PASSWORD" -keypass "$KEY_PASSWORD" \
              -alias "$KEY_ALIAS" -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=MusicMeta Build,O=MusicMeta,C=US"
          fi

          "$BUILD_TOOLS/apksigner" sign \
            --ks "$KEYSTORE_PATH" \
            --ks-pass "pass:$STORE_PASSWORD" \
            --key-pass "pass:$KEY_PASSWORD" \
            --ks-key-alias "$KEY_ALIAS" \
            --out "$MUSICMETA_APK" \
            "$RUNNER_TEMP/musicmeta-release-aligned.apk"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$MUSICMETA_APK"
          "$BUILD_TOOLS/aapt" dump badging "$MUSICMETA_APK" | head -n 5
      - name: Check APK package metadata
        run: |
          test -s "$MUSICMETA_APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$MUSICMETA_APK" | grep -q "package: name='com.wulinlee.musicmeta'"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$MUSICMETA_APK"
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MusicMeta-v${{ env.MUSICMETA_VERSION }}
          path: ${{ env.MUSICMETA_APK }}
          if-no-files-found: error
          retention-days: 30
      - name: Publish preview or explicitly requested formal release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_RELEASE_TYPE: ${{ github.event_name == 'workflow_dispatch' && inputs.release_type || (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'release:') && 'formal') || 'preview' }}
          REFRESH_EXISTING_RELEASE: "${{ github.event_name == 'push' && startsWith(github.event.head_commit.message, 'release: refresh v') }}"
        run: |
          RELEASE_TYPE="$REQUESTED_RELEASE_TYPE"
          if [[ "$RELEASE_TYPE" == "formal" ]]; then
            VERSION="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)"
            if [[ -z "$VERSION" ]]; then
              echo "Could not determine Android versionName." >&2
              exit 1
            fi
            TAG="v$VERSION"
            sed 's/预览版/正式版/g' RELEASE_NOTES.md > "$RUNNER_TEMP/formal-release-notes.md"
            if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              if [[ "$REFRESH_EXISTING_RELEASE" != "true" ]]; then
                echo "Release $TAG already exists; refusing to replace it without an explicit 'release: refresh v...' commit." >&2
                exit 1
              fi
              echo "Explicitly refreshing $TAG from the current verified build."
              git tag -f "$TAG" "$GITHUB_SHA"
              git push --force origin "refs/tags/$TAG"
              gh release upload "$TAG" "$MUSICMETA_APK" --clobber --repo "$GITHUB_REPOSITORY"
            else
              gh release create "$TAG" "$MUSICMETA_APK" \
                --repo "$GITHUB_REPOSITORY" \
                --title "音笺 MusicMeta v$VERSION" \
                --notes-file "$RUNNER_TEMP/formal-release-notes.md" \
                --target "$GITHUB_SHA"
            fi

            PREVIEW_TAG="preview-$(git rev-parse --short "$GITHUB_SHA")"
            if gh release view "$PREVIEW_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "Preview backup $PREVIEW_TAG already exists; keeping the existing artifact."
            else
              gh release create "$PREVIEW_TAG" "$MUSICMETA_APK" \
                --repo "$GITHUB_REPOSITORY" \
                --title "音笺 MusicMeta 预览备份 $PREVIEW_TAG" \
                --notes-file RELEASE_NOTES.md \
                --prerelease \
                --target "$GITHUB_SHA"
            fi
          else
            TAG="preview-$(git rev-parse --short "$GITHUB_SHA")"
            if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "Preview release $TAG already exists; keeping the existing artifact."
            else
              gh release create "$TAG" "$MUSICMETA_APK" \
                --repo "$GITHUB_REPOSITORY" \
                --title "音笺 MusicMeta 预览版 $TAG" \
                --notes-file RELEASE_NOTES.md \
                --prerelease \
                --target "$GITHUB_SHA"
            fi
          fi
      - name: Keep only ten milestone releases
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CURRENT_VERSION="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)"
          CURRENT_TAG="v$CURRENT_VERSION"
          # Keep the current version plus nine milestones that show the project's evolution.
          KEEP_TAGS=" $CURRENT_TAG v1.20 v1.19 v1.18 v1.17 v1.15 v1.12 v1.10 v1.0.0 v0.1.4 "
          while IFS= read -r TAG; do
            [[ -z "$TAG" ]] && continue
            if [[ "$KEEP_TAGS" == *" $TAG "* ]]; then
              echo "Keeping milestone release: $TAG"
            else
              echo "Deleting non-milestone release: $TAG"
              gh release delete "$TAG" --yes --repo "$GITHUB_REPOSITORY"
            fi
          done < <(gh release list --limit 1000 --json tagName --jq '.[].tagName')
